# Tiny Tapeout project information
project:
  title:        "EdgeGuard Offline Power Protection ASIC"      # Project title
  author:       "SMM Siam"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Hardware voltage surge and brownout protection ASIC for small business appliances"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000    # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_edgeguard_asic"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Voltage ADC bit 0"
  ui[1]: "Voltage ADC bit 1"
  ui[2]: "Voltage ADC bit 2"
  ui[3]: "Voltage ADC bit 3"
  ui[4]: "Voltage ADC bit 4"
  ui[5]: "Voltage ADC bit 5"
  ui[6]: "Voltage ADC bit 6"
  ui[7]: "Voltage ADC bit 7"

  # Outputs
  uo[0]: "Relay Trip Cutoff"
  uo[1]: "Voltage Warning Flag"
  uo[2]: "Fault Counter bit 0"
  uo[3]: "Fault Counter bit 1"
  uo[4]: "Fault Counter bit 2"
  uo[5]: "Fault Counter bit 3"
  uo[6]: "Fault Counter bit 4"
  uo[7]: "Fault Counter bit 5"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
